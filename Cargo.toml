[package]
name = "codecrafters-shell"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.91"

[dependencies]
anyhow = "1.0"                                # error handling
bytes = "1.11"                                  # helps manage buffers
rustyline = { version = "18", features = ["derive"] }
rustyline-derive = "0.12"
thiserror = "2"                             # error handling
